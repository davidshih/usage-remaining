<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="How UsageWidget gets its data">
  <title>How UsageWidget gets its data</title>
  <style>
    .bg{fill:#ffffff} .box{fill:#f4f5f7;stroke:#c9ccd3;stroke-width:1.2} .hl{fill:#e8f1fb;stroke:#378add;stroke-width:1.4}
    .t{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1d1d1f}
    .s{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#5c6470}
    .m{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#5c6470}
    .a{stroke:#8a909a;stroke-width:1.6;fill:none;marker-end:url(#arr)} .ah{fill:#8a909a}
    @media (prefers-color-scheme: dark){
      .bg{fill:#16181c} .box{fill:#1f2328;stroke:#3a4049} .hl{fill:#16263a;stroke:#5aa2e8}
      .t{fill:#e6e9ed} .s,.m{fill:#9aa4b0} .a{stroke:#7d8590} .ah{fill:#7d8590}
    }
  </style>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="bg" x="0" y="0" width="760" height="300" rx="14"/>

  <rect class="hl" x="24" y="110" width="170" height="80" rx="10"/>
  <text class="t" x="109" y="145" text-anchor="middle">UsageWidget</text>
  <text class="s" x="109" y="166" text-anchor="middle">every 2 min</text>

  <rect class="box" x="290" y="30" width="200" height="76" rx="10"/>
  <text class="t" x="390" y="62" text-anchor="middle">codex app-server</text>
  <text class="m" x="390" y="84" text-anchor="middle">account/rateLimits/read</text>

  <rect class="box" x="290" y="150" width="200" height="56" rx="10"/>
  <text class="t" x="390" y="176" text-anchor="middle">macOS Keychain</text>
  <text class="s" x="390" y="194" text-anchor="middle">read-only OAuth token</text>

  <rect class="box" x="560" y="150" width="176" height="76" rx="10"/>
  <text class="t" x="648" y="182" text-anchor="middle">api.anthropic.com</text>
  <text class="m" x="648" y="204" text-anchor="middle">/api/oauth/usage</text>

  <rect class="box" x="560" y="30" width="176" height="76" rx="10"/>
  <text class="t" x="648" y="62" text-anchor="middle">OpenAI</text>
  <text class="s" x="648" y="84" text-anchor="middle">via your Codex login</text>

  <path class="a" d="M194,135 C240,135 245,68 288,68"/>
  <text class="s" x="214" y="92">Codex</text>
  <path class="a" d="M194,165 C240,165 250,178 288,178"/>
  <text class="s" x="214" y="196">Claude</text>
  <path class="a" d="M490,68 L558,68"/>
  <path class="a" d="M490,178 L558,186"/>
  <text class="s" x="390" y="262" text-anchor="middle">Display only: no writes, no token refresh, no reset claims.</text>
</svg>
